<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Investment Co-pilot</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #00c896;
      --accent2:   #3b82f6;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --user-bg:   #1e3a5f;
      --agent-bg:  #1a1d27;
      --danger:    #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header-title { font-weight: 700; font-size: 16px; }
    .header-sub { font-size: 12px; color: var(--muted); }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Quick actions bar ── */
    .quick-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .quick-bar::-webkit-scrollbar { height: 0; }
    .chip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,200,150,0.06); }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg { display: flex; gap: 10px; max-width: 820px; width: 100%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.agent { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; margin-top: 2px;
    }
    .msg.user .avatar { background: var(--user-bg); }
    .msg.agent .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      max-width: calc(100% - 44px);
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-top-right-radius: 2px;
    }
    .msg.agent .bubble {
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 2px;
    }

    /* Markdown inside agent bubbles */
    .bubble h1, .bubble h2, .bubble h3 {
      color: var(--accent);
      margin: 12px 0 6px;
      font-size: 1em;
    }
    .bubble h3 { color: var(--accent2); }
    .bubble p { margin: 6px 0; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble li { margin: 3px 0; }
    .bubble strong { color: #fff; }
    .bubble code {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: "SF Mono", monospace;
      font-size: 13px;
    }
    .bubble pre {
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble pre code { background: transparent; padding: 0; }
    .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    .bubble th { background: rgba(0,200,150,0.1); padding: 6px 10px; text-align: left; font-size: 13px; }
    .bubble td { padding: 5px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }

    .tools-used {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .tool-chip {
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      color: var(--accent2);
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 11px;
    }

    /* Typing indicator */
    .typing .bubble { padding: 14px 16px; }
    .dots { display: flex; gap: 4px; align-items: center; height: 18px; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* Welcome card */
    .welcome {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      align-self: center;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .welcome h2 { color: var(--accent); margin-bottom: 8px; }
    .welcome p { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    .welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .welcome-chip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }
    .welcome-chip:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Input bar ── */
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 14px;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
      line-height: 1.5;
    }
    #input:focus { border-color: var(--accent); }
    #input::placeholder { color: var(--muted); }
    #sendBtn {
      background: var(--accent);
      border: none;
      color: #000;
      width: 44px; height: 44px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    #sendBtn:hover { opacity: 0.85; }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Error toast */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--danger); color: #fff;
      padding: 10px 20px; border-radius: 8px;
      font-size: 13px; z-index: 100;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-left">
    <div class="logo">📈</div>
    <div>
      <div class="header-title">AI Investment Co-pilot</div>
      <div class="header-sub">Gemini 2.5 Flash · Firebase · Personal</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-dot" title="Agent online"></div>
    <button class="btn-reset" onclick="resetSession()">↺ New session</button>
  </div>
</header>

<!-- Quick action chips -->
<div class="quick-bar">
  <button class="chip" onclick="sendQuick('Am I on track for FIRE at 47?')">🎯 FIRE check</button>
  <button class="chip" onclick="sendQuick('Run a gap analysis on my finances')">🔍 Gap analysis</button>
  <button class="chip" onclick="sendQuick('Show my portfolio holdings')">📊 Portfolio</button>
  <button class="chip" onclick="sendQuick('What are my German tax deadlines?')">📅 Tax deadlines</button>
  <button class="chip" onclick="sendQuick('Help me fill Anlage KAP in Elster')">🧾 Elster guide</button>
  <button class="chip" onclick="sendQuick('What is my Vorabpauschale for 2026?')">💰 Vorabpauschale</button>
  <button class="chip" onclick="sendQuick('Generate my weekly investment insight')">💡 Weekly insight</button>
  <button class="chip" onclick="sendQuick('Should I rebalance my portfolio?')">⚖️ Rebalance</button>
  <button class="chip" onclick="sendQuick('Show my recent notifications')">🔔 Notifications</button>
  <button class="chip" onclick="sendQuick('What should I invest this month?')">💸 This month</button>
</div>

<!-- Messages -->
<div id="messages">
  <div class="welcome" id="welcome">
    <h2>Namaste, Nitish 👋</h2>
    <p>Your personal AI Investment Co-pilot. Ask anything about your finances, FIRE plan, German taxes, or portfolio.</p>
    <div class="welcome-chips">
      <button class="welcome-chip" onclick="sendQuick('Am I on track for FIRE at 47?')">Am I on track for FIRE at 47?</button>
      <button class="welcome-chip" onclick="sendQuick('What should I invest this month?')">What to invest this month?</button>
      <button class="welcome-chip" onclick="sendQuick('What is my Vorabpauschale for 2026?')">Vorabpauschale 2026?</button>
      <button class="welcome-chip" onclick="sendQuick('Compare VWCE vs Tagesgeld after-tax return')">VWCE vs Tagesgeld returns</button>
    </div>
  </div>
</div>

<!-- Input bar -->
<div class="input-bar">
  <textarea id="input" placeholder="Ask about your FIRE plan, taxes, portfolio..." rows="1"></textarea>
  <button id="sendBtn" onclick="sendMessage()" title="Send (Enter)">➤</button>
</div>

<script>
  let sessionId = localStorage.getItem('sessionId') || null;
  let isTyping = false;

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('sendBtn');
  const welcomeEl  = document.getElementById('welcome');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  // Enter to send (Shift+Enter for newline)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendQuick(text) {
    inputEl.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isTyping) return;

    // Hide welcome card on first message
    if (welcomeEl) welcomeEl.style.display = 'none';

    appendMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';

    const typingEl = appendTyping();
    setSending(true);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: 'Server error' }));
        throw new Error(err.error || `HTTP ${res.status}`);
      }

      const data = await res.json();
      sessionId = data.sessionId;
      localStorage.setItem('sessionId', sessionId);

      typingEl.remove();
      appendMessage('agent', data.text, data.toolsUsed);

    } catch (err) {
      typingEl.remove();
      showToast(err.message || 'Something went wrong');
    } finally {
      setSending(false);
      inputEl.focus();
    }
  }

  function appendMessage(role, text, toolsUsed = []) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const right = document.createElement('div');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'agent') {
      bubble.innerHTML = marked.parse(text);
    } else {
      bubble.textContent = text;
    }

    right.appendChild(bubble);

    if (toolsUsed && toolsUsed.length > 0) {
      const toolsDiv = document.createElement('div');
      toolsDiv.className = 'tools-used';
      toolsUsed.forEach(t => {
        const chip = document.createElement('span');
        chip.className = 'tool-chip';
        chip.textContent = t;
        toolsDiv.appendChild(chip);
      });
      right.appendChild(toolsDiv);
    }

    div.appendChild(avatar);
    div.appendChild(right);
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function appendTyping() {
    const div = document.createElement('div');
    div.className = 'msg agent typing';
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function setSending(v) {
    isTyping = v;
    sendBtn.disabled = v;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function resetSession() {
    try {
      const res = await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId })
      });
      const data = await res.json();
      sessionId = data.sessionId;
      localStorage.setItem('sessionId', sessionId);

      // Clear messages and show welcome again
      messagesEl.innerHTML = '';
      const welcome = document.createElement('div');
      welcome.className = 'welcome';
      welcome.id = 'welcome';
      welcome.innerHTML = `
        <h2>Session reset ✓</h2>
        <p>Starting fresh. Ask me anything.</p>`;
      messagesEl.appendChild(welcome);
    } catch {
      showToast('Could not reset session');
    }
  }

  function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  // Focus input on load
  window.addEventListener('load', () => inputEl.focus());
</script>
</body>
</html>
